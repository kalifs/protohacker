# fly.toml app configuration file generated for 01-prime on 2026-08-10T14:23:06+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = '00-echo'
primary_region = 'ams'

[env]
HOST = "fly-global-services"

[[services]]
protocol = 'udp'
internal_port = 5000
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[services.ports]]
port = 5000

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
memory_mb = 1024

[build]
dockerfile = "Dockerfile"
